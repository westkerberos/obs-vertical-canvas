TikTok.DualMainOutputMissing.Message="El feed horizontal de TikTok reutiliza los encoders de video y audio activos del Main Canvas de OBS. Iniciá primero tu transmisión horizontal (por ejemplo, YouTube horizontal) y después volvé a iniciar TikTok Dual LIVE. Para que el feed vertical reutilice Twitch EBC, iniciá Twitch Enhanced Broadcasting antes de las salidas verticales."
